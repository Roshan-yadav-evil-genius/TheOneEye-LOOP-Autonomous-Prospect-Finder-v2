[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-api"
version = "0.1.0"
description = "LOOP modular-monolith API foundation"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22",
  "alembic>=1.18",
  "deepagents>=0.6",
  "fastapi==0.139.0",
  "langchain-core>=1.4",
  "langchain-mcp-adapters>=0.2",
  "langchain-ollama>=1.1",
  "langchain-openai>=1.2",
  "langgraph-checkpoint-postgres>=3.0",
  "prometheus-client>=0.25",
  "opentelemetry-api>=1.41",
  "opentelemetry-sdk>=1.41",
  "psycopg[binary]>=3.3",
  "pydantic-settings==2.14.0",
  "redis>=8.0",
  "sqlalchemy>=2.0",
  "structlog>=26.1",
  "typer>=0.25",
  "uvicorn[standard]==0.46.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "mypy>=1.18",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "ruff>=0.12",
]

[project.scripts]
loop = "loop_api.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
loop_api = ["agents/prompt_files/*.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "../packages/testing"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "contract: OpenAPI/contract fixtures",
  "integration: cross-component integration",
  "chaos: recovery and failure injection",
  "load: local bounded load profiles",
  "security: redaction and isolation checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["loop_api"]
